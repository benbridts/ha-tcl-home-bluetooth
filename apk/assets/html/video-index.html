<!DOCTYPE html>
<html lang="en" manifest="./alls.manifest">

<head>
    <meta charset="UTF-8" />
    <title>Recommended</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no,date=no,address=no,email=no,url=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-touch-fullscreen" content="yes">
    <!-- px to rem -->
    <script
        type="text/javascript">!function (e, t) { function n() { t.body ? t.body.style.fontSize = 12 * o + "px" : t.addEventListener("DOMContentLoaded", n) } function d() { var e = i.clientWidth / 10; i.style.fontSize = e + "px" } var i = t.documentElement, o = e.devicePixelRatio || 1; if (n(), d(), e.addEventListener("resize", d), e.addEventListener("pageshow", function (e) { e.persisted && d() }), o >= 2) { var a = t.createElement("body"), s = t.createElement("div"); s.style.border = ".5px solid transparent", a.appendChild(s), i.appendChild(a), 1 === s.offsetHeight && i.classList.add("hairlines"), i.removeChild(a) } }(window || (0, eval)('this'), document);</script>
    <!-- loading css -->
    <style type="text/css">
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            -webkit-box-sizing: border-box;
            font-family: Helvetica
        }

        body,
        html {
            height: 100%;
            width: 100%;
            color: #222
        }

        html {
            line-height: 1.15;
            -webkit-text-size-adjust: 100%
        }

        .table {
            display: table
        }

        .h100p {
            height: 100%
        }

        .w100p {
            width: 100%
        }

        .th-loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 10000;
            width: 100%;
            height: 100%;
            background-color: #f4f4f4
        }

        .th-loading-layout {
            position: relative;
            z-index: 2;
            display: table-cell;
            width: 100%;
            height: 100%;
            vertical-align: middle;
            text-align: center
        }

        .loading {
            text-transform: uppercase;
            font-family: Helvetica-Bold, 'MS Sans Serif', Helvetica;
            font-weight: 700;
            font-size: .75rem;
            text-align: center;
            height: .8rem;
            vertical-align: top;
            display: block;
            -webkit-transform: scale(1.2, 1) translate3d(0, 0, 0);
            transform: scale(1.2, 1) translate3d(0, 0, 0);
            margin-bottom: .533333rem
        }

        .wave {
            background-image: url(./images/bg.png);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 rgba(0, 0, 0, .06);
            -webkit-text-shadow: 0 0 rgba(0, 0, 0, .06);
            animation: wave-animation 1s infinite linear, loading-animation 4.5s infinite linear;
            -webkit-animation: wave-animation 1s infinite linear, loading-animation 4.5s infinite linear;
            background-size: 1.1rem 1rem;
            background-repeat: repeat-x;
            opacity: 1
        }

        .loading-css {
            text-align: center;
            color: #999;
            font-size: .346667rem
        }

        @keyframes wave-animation {
            0% {
                background-position: 0 bottom
            }

            100% {
                background-position: 1.1rem bottom
            }
        }

        @-webkit-keyframes wave-animation {
            0% {
                background-position: 0 bottom
            }

            100% {
                background-position: 1.1rem bottom
            }
        }

        @keyframes loading-animation {
            0% {
                background-size: 1.1rem 0;
                opacity: 1
            }

            95% {
                opacity: 1
            }

            100% {
                background-size: 1.1rem 1.1rem;
            }
        }

        @-webkit-keyframes loading-animation {
            0% {
                background-size: 1.1rem 0;
                opacity: 1
            }

            95% {
                opacity: 1
            }

            100% {
                background-size: 1.1rem 1.1rem;
            }
        }
    </style>
    <!-- <script type="text/javascript" src="./js/sea.js"></script> -->
    <script type="text/javascript" src="./js/sea.js"></script>
    <!-- <script src="./js/vconsole.min.js"></script>
    <script>
        // init vConsole
        var vConsole = new VConsole();
        console.log('Hello world');
    </script> -->
</head>

<body class="toggle-hide">

    <noscript>
        <strong>We're sorry but codesandbox doesn't work properly without JavaScript enabled. Please enable it to
            continue.</strong>
    </noscript>

    <!-- tcl loading -->
    <div class="th-loading" v-disabled>
        <div class="w100p h100p table">
            <div class="th-loading-layout">
                <div class="loading wave">TCL</div>
                <p class="loading-css">Loading...</p>
            </div>
        </div>
    </div>

    <!-- content -->
    <div id="TLife-app-video-homey" style="height:100%" class="h100p" v-cloak>
        <!-- layout start -->
        <md-scroll-view class="TLife-layout-con hbds" :class="[(!isApp?'pt88':'')]" ref="VideoScrollView"
            :scrolling-x="false" :auto-reflow="true" :is-prevent="false" :end-reached-threshold="0" @scroll="_onScroll"
            @refreshing="_onRefresh" @end-reached="_onEndReached">

            <!-- refresh down icon -->
            <md-scroll-view-refresh :class="[(isOpacity?'is-opacity':'')]" slot="refresh" slot-scope="all"
                :scroll-top="all.scrollTop" :is-refreshing="all.isRefreshing" :is-refresh-active="all.isRefreshActive"
                :roller-color="iconColor" :refresh-text="refreshText" :refresh-active-text="refreshActiveText"
                :refreshing-text="refreshingText"></md-scroll-view-refresh>
            <!-- header -->
            <tl-header slot="header" v-if="!isApp" title="Recommended" :headeropacity="headerOpacity"
                :headercolor="headerColor" :scrolltops="scrollTops" @isopacitys="isOpacityFn" ref="tlHeader">
            </tl-header>
            <div v-if="YouTube.length== '' ? true:false">
                <div class="TLife-app-video-home">
                    <!-- <div class="TLife-app-video-title">
                            <span class="TLife-app-video-tag">Recommended</span>
                        </div> -->
                    <div class="tlife-none-data" v-if="Nodata">
                        <span class="tlife-none-data-img video-nones"></span>
                        <p>{{ MNoData }}</p>
                    </div>

                    <div class="tlife-none-data" v-else-if="FailedToLoad">
                        <span class="tlife-none-data-img errors"></span>
                        <p class="v-items tits" v-if="MFailedToLoadTit">{{ MFailedToLoadTit }}</p>
                        <p class="v-items">{{ MFailedToLoadTxt }}</p>
                        <p class="v-items">
                            <md-button @click="getDIQU" class="video-retry" type="default" size="small" inline round
                                plain>
                                <!-- <md-activity-indicator :size="14" :text-size="14" v-if="tryloading" color="#222"
                                    text-color="#222">Loading...</md-activity-indicator> -->

                                <!-- <span v-else>Retry</span> -->
                            </md-button>
                        </p>
                    </div>
                    <div class="TLife-app-video-content cf" v-else-if="!Nodata&&!FailedToLoad&&data.length>0">
                        <div class="TLife-app-video-item" v-for="(v,i) in data" :key="i">
                            <a href="javascript:void(0);" class="TLife-app-video-item-in"
                                :class="[(v.type===2?'ad':'')]"
                                :style="{backgroundColor: v.color,backgroundImage:'url('+v.picture+')'}"
                                @click="JumpDetail(v)">
                                <span class="ad-icons">ad</span>
                                <div class="titles">
                                    <p>{{v.title}}</p>
                                </div>
                            </a>
                        </div>
                    </div>

                </div>
            </div>
            <md-tabs v-else>
                <md-tab-pane class="content" name="p1" id="tabsP1" label="TCL">
                    <div class="TLife-app-video-home">
                        <div class="tlife-none-data" v-if="Nodata">
                            <span class="tlife-none-data-img video-nones"></span>
                            <p>{{ MNoData }}</p>
                        </div>

                        <div class="tlife-none-data" v-else-if="FailedToLoad">
                            <span class="tlife-none-data-img errors"></span>
                            <p class="v-items tits" v-if="MFailedToLoadTit">{{ MFailedToLoadTit }}</p>
                            <p class="v-items">{{ MFailedToLoadTxt }}</p>
                            <p class="v-items">
                                <md-button @click="getDIQU" class="video-retry" type="default" size="small" inline round
                                    plain>
                                    <!-- <md-activity-indicator :size="14" :text-size="14" v-if="tryloading" color="#222"
                                        text-color="#222">Loading...</md-activity-indicator> -->

                                    <!-- <span v-else>Retry</span> -->
                                </md-button>
                            </p>
                        </div>
                        <div class="TLife-app-video-content cf" v-else-if="!Nodata&&!FailedToLoad&&YouTube.length>0">
                            <div class="TLife-app-video-item" v-for="(v,i) in YouTube" :key="i">
                                <a href="javascript:void(0);" class="TLife-app-video-item-in"
                                    :class="[(v.type===2?'ad':'')]"
                                    :style="{backgroundColor: v.color,backgroundImage:'url('+v.surfacePlot+')'}"
                                    @click="JumpDetails(v)">
                                    <span class="ad-icons">ad</span>
                                    <div class="titles">
                                        <p>{{v.title}}</p>
                                    </div>
                                </a>
                            </div>
                        </div>

                    </div>
                </md-tab-pane>
                <md-tab-pane class="content" name="p2" id="tabsP2" label="YouTube">
                    <div class="TLife-app-video-home">
                        <!-- <div class="TLife-app-video-title">
                                <span class="TLife-app-video-tag">Recommended</span>
                            </div> -->
                        <div class="tlife-none-data" v-if="Nodata">
                            <span class="tlife-none-data-img video-nones"></span>
                            <p>{{ MNoData }}</p>
                        </div>

                        <div class="tlife-none-data" v-else-if="FailedToLoad">
                            <span class="tlife-none-data-img errors"></span>
                            <p class="v-items tits" v-if="MFailedToLoadTit">{{ MFailedToLoadTit }}</p>
                            <p class="v-items">{{ MFailedToLoadTxt }}</p>
                            <p class="v-items">
                                <md-button @click="getDIQU" class="video-retry" type="default" size="small" inline round
                                    plain>
                                    <!-- <md-activity-indicator :size="14" :text-size="14" v-if="tryloading" color="#222"
                                        text-color="#222">Loading...</md-activity-indicator> -->

                                    <!-- <span v-else>Retry</span> -->
                                </md-button>
                            </p>
                        </div>
                        <div class="TLife-app-video-content cf" v-else-if="!Nodata&&!FailedToLoad&&data.length>0">
                            <div class="TLife-app-video-item" v-for="(v,i) in data" :key="i">
                                <a href="javascript:void(0);" class="TLife-app-video-item-in"
                                    :class="[(v.type===2?'ad':'')]"
                                    :style="{backgroundColor: v.color,backgroundImage:'url('+v.picture+')'}"
                                    @click="JumpDetail(v)">
                                    <span class="ad-icons">ad</span>
                                    <div class="titles">
                                        <p>{{v.title}}</p>
                                    </div>
                                </a>
                            </div>
                        </div>

                    </div>
                </md-tab-pane>

            </md-tabs>
            <!-- more -->
            <div class="video-index-more reset-more-class" slot="more" v-if="!Nodata&&!FailedToLoad">
                <span class="video-index-more-in">
                    <!-- <md-activity-indicator :size="14" :text-size="14" color="#F3130A" text-color="#999"
                        v-if="!isFinished"> {{ loadingText }} </md-activity-indicator> -->

                    <!-- <span class="txts" v-else> {{ finishedText }} </span>-->
                </span>
            </div>

        </md-scroll-view>
    </div>

</body>

</html>
<script type="text/javascript">
    // var _js = './js/';
    // var _css = './css/';
    var _js = './js/';
    var _css = './css/';

    seajs.use([_css + 'base.css', _css + 'common.css'], function () {
        seajs.use([_js + 'util', _js + 'axios.min', _js + 'vue'], function () {
            seajs.use([_js + 'vue-base', _js + 'base'], function () {
                seajs.use(_js + 'video-index')
            })
        })
    })

</script>
